name: Test and release Windows update
on:
  push:
    branches: [main]
    paths: [version.json]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    env:
      FOOTSHORTS_GUI_TESTS: '1'
      SDL_AUDIODRIVER: dummy
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test
        run: python -m unittest discover -p "test_*.py" -v
      - name: Validate version and build
        shell: pwsh
        run: |
          $version = (Get-Content version.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Tag and version.json must match'
          }
          python scripts/build_release.py
      - name: Build offline EXE installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { choco install innosetup --no-progress -y }
          python scripts/build_installer.py
      - name: Verify installer offline, paths with spaces and bundled dependencies
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'Football Shorts Installed'
          $install = Start-Process -FilePath dist/FootballShorts-Setup.exe -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="' + $target + '"')) -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw 'Installer failed' }
          $oldPath = $env:PATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Push-Location $target
          try {
            & "$target\.runtime\python.exe" "$target\runtime_manager.py" --repair
            if ($LASTEXITCODE -ne 0) { throw 'Bundled runtime validation failed' }
            & "$target\.runtime\python.exe" -c "import tkinter; w=tkinter.Tk(); w.withdraw(); w.destroy(); import core,rapidocr_onnxruntime,clip_timeline,channel_templates,channel_ui; core.run([core.ffmpeg(),'-version']); print('Installed Tk, OCR, timeline, templates and video modules are ready')"
            if ($LASTEXITCODE -ne 0) { throw 'Installed application imports failed' }
          } finally { Pop-Location; $env:PATH = $oldPath }
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content version.json | ConvertFrom-Json).version
          gh release create "v$version" dist/FootballShorts-Setup.exe dist/FootballShorts-Windows.zip dist/FootballShorts-update.zip dist/update.json --title "Football Shorts $version" --generate-notes --target "$env:GITHUB_SHA"
